name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      - name: Run Pint
        run: vendor/bin/pint

      - name: Static Analysis (PHPStan/Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Format Frontend
        run: npm run format

      - name: Lint Frontend
        run: npm run lint

      # Non-blocking: composer audit's network dependency and the known
      # ESLint-devDependency-chain advisories (see docs/13-Security-Audit.md)
      # mean these should be visible in CI logs without failing the build
      # over a devDependency issue that never ships to production.
      - name: Dependency Audit (composer)
        run: composer audit
        continue-on-error: true

      - name: Dependency Audit (npm)
        run: npm audit
        continue-on-error: true

      # - name: Commit Changes
      #   uses: stefanzweifel/git-auto-commit-action@v5
      #   with:
      #     commit_message: fix code style
      #     commit_options: '--no-verify'
